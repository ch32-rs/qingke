name: Rust

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Prepare Rust Target
      run: rustup target add riscv32imc-unknown-none-elf
    - name: Build
      run: |
        cargo build -p qingke-rt-macros
        cargo build -p qingke --no-default-features --features v2a,unsafe-trust-wch-atomics,critical-section-impl --target riscv32imc-unknown-none-elf
        cargo build -p qingke-rt --no-default-features --features v2a --target riscv32imc-unknown-none-elf
        # imafc advertises atomics; qingke-rt only pulls qingke with critical-section-impl, so use imc here too.
        cargo build -p qingke --no-default-features --features v3f,dual-core,unsafe-trust-wch-atomics,critical-section-impl --target riscv32imc-unknown-none-elf
        cargo build -p qingke --no-default-features --features v5f,dual-core,unsafe-trust-wch-atomics,critical-section-impl --target riscv32imc-unknown-none-elf
        cargo build -p qingke-rt --no-default-features --features v3f --target riscv32imc-unknown-none-elf
        cargo build -p qingke-rt --no-default-features --features v5f --target riscv32imc-unknown-none-elf
