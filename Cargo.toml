[workspace]
members = ["qingke-rt", "qingke-rt/macros"]

[workspace.package]
authors = ["Andelf <andelf@gmail.com>"]
repository = "https://github.com/ch32-rs/qingke"
documentation = "https://docs.rs/qingke"
homepage = "https://github.com/ch32-rs/qingke"
categories = ["embedded", "no-std", "hardware-support"]
license = "MIT/Apache-2.0"
version = "0.8.0" # for rt and macros
edition = "2024"

[package]
name = "qingke"
version.workspace = true
edition.workspace = true
authors.workspace = true
repository.workspace = true
documentation.workspace = true
homepage.workspace = true
categories.workspace = true
license.workspace = true
description = "Low level access to WCH's QingKe RISC-V processors"
keywords = ["qingke", "wch", "riscv", "ch32v"]
readme = "README.md"
build = "build.rs"

[dependencies]
bit_field = "0.10.2"
riscv = "0.16.1"
cfg-if = "1.0"
critical-section = { version = "1.2.0", features = [
    "restore-state-bool",
], optional = true }
defmt = { version = "1.0.1", optional = true }

[features]
critical-section-impl = ["dep:critical-section"]
defmt = ["dep:defmt"]
dual-core = []
unsafe-trust-wch-atomics = []

# Leaf QingKe cores (match ch32-data `cores[].name` without the `qingke-` prefix).
# Capability flags (`csr_*`, `dm_dataaddr_*`, `qingke_v3`, …) are set in `build.rs`.
v2a = []
v2c = []
v3a = []
v3b = []
v3f = []
v4a = []
v4b = []
v4c = []
v4f = []
v4j = []
v5f = []

# docs.rs: must enable exactly one leaf (build.rs); imc avoids imafc atomics guard.
[package.metadata.docs.rs]
targets = ["riscv32imc-unknown-none-elf"]
features = ["v4f", "critical-section-impl"]
